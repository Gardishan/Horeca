version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
    groups:
      # next и eslint-config-next связаны жёстким CI-гейтом
      # (scripts/check-repository.mjs:241-246 требует одинаковых версий).
      # Они обязаны идти ОДНИМ PR, иначе каждый npm-PR детерминированно
      # роняет Quality — см. PR #41/#42, красные с 2026-08-09.
      nextjs-lockstep:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Major upgrades are coordinated in a tracked engineering issue because
    # the Node/Next/TypeScript/ESLint/Prisma compatibility matrix must move as
    # one reviewed change. Dependabot security updates are unaffected by this
    # version-update filter.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Almaty
    open-pull-requests-limit: 5
