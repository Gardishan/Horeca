name: Strict MVP Release Gate Evidence

on:
  push:
    branches:
      - agent/record-fresh-beta-secret-blocker
    paths:
      - .github/workflows/codex-mvp-release-check.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: horeca
          POSTGRES_USER: horeca
          POSTGRES_PASSWORD: horeca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horeca -d horeca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEPLOYMENT_VERSION: ${{ github.sha }}
      DATABASE_URL: postgresql://horeca:horeca@localhost:5432/horeca?schema=public
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PRIVATE_STORAGE_MODE: filesystem
      PRIVATE_STORAGE_ROOT: /tmp/horeca-private
      DEMO_AUTH_ENABLED: "true"
      RATE_LIMIT_MODE: memory
      RATE_LIMIT_ALLOW_IN_MEMORY: "true"
      MALWARE_SCAN_MODE: mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mvp:release-check
