name: Beta Launch
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-beta-launch
  cancel-in-progress: false
jobs:
  read-only-diagnostic:
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @railway/cli@5.41.2
      - name: Read deployment and rollback return type with project token
        env:
          RAILWAY_TOKEN: ${{ secrets.BETA_RAILWAY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          probe_dir="${RUNNER_TEMP}/horeca-readonly-probe"
          mkdir -p "${probe_dir}"
          export PROBE_DIR="${probe_dir}"
          set +e
          railway api --compact --raw-var 'id=f584d829-d541-4054-8757-91508cadfa1a' 'query DeploymentForRollback($id: String!) { deployment(id: $id) { id status canRollback meta } }' > "${probe_dir}/deployment.json" 2> "${probe_dir}/deployment.stderr"
          export DEPLOYMENT_QUERY_EXIT=$?
          railway api describe deploymentRollback --compact > "${probe_dir}/rollback-schema.json" 2> "${probe_dir}/schema.stderr"
          export SCHEMA_QUERY_EXIT=$?
          set -e
          python3 - <<'PYTHON'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ['PROBE_DIR'])
          token=os.environ['RAILWAY_TOKEN']
          def read(name):
              try:return json.loads((p/name).read_text())
              except Exception:return {'unparsed':True}
          d=read('deployment.json')
          deployment=(d.get('data') or {}).get('deployment') or {}
          errors=[]
          for error in d.get('errors',[]):
              message=str(error.get('message','')).replace(token,'[REDACTED]')
              message=re.sub(r'postgres(?:ql)?://[^\s]+','[REDACTED]',message)
              errors.append(message[:400])
          print(json.dumps({'deploymentQueryExit':int(os.environ['DEPLOYMENT_QUERY_EXIT']),'deployment':{k:deployment.get(k) for k in ['id','status','canRollback']},'hasImageDigest':bool((deployment.get('meta') or {}).get('imageDigest')),'errors':errors,'unparsed':d.get('unparsed',False)}))
          schema=read('rollback-schema.json')
          # GraphQL introspection contains schema only, no runtime variable values.
          print(json.dumps({'schemaQueryExit':int(os.environ['SCHEMA_QUERY_EXIT']),'rollbackSchema':schema}))
          PYTHON
