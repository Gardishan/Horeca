name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: horeca
          POSTGRES_USER: horeca
          POSTGRES_PASSWORD: horeca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horeca -d horeca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEPLOYMENT_VERSION: ${{ github.sha }}
      DATABASE_URL: postgresql://horeca:horeca@localhost:5432/horeca?schema=public
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PRIVATE_STORAGE_MODE: filesystem
      PRIVATE_STORAGE_ROOT: /tmp/horeca-private
      DEMO_AUTH_ENABLED: "true"
      RATE_LIMIT_MODE: memory
      RATE_LIMIT_ALLOW_IN_MEMORY: "true"
      MALWARE_SCAN_MODE: mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Build deployable container
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" --tag "horeca:${GITHUB_SHA}" .
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run smoke:http
      - run: npm run security:audit

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build local-emulator debug APK
        working-directory: android
        run: gradle :app:assembleDebug -PwebAppUrl=http://10.0.2.2:3000
      - uses: actions/upload-artifact@v7
        with:
          name: horeca-kz-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
